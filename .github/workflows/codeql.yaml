name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Monday 08:00 UTC — catches advisories published since the last push.
    - cron: "0 8 * * 1"

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Two languages, not one. Analysing only Go leaves the workflows unscanned —
  # and they are the half that holds the credentials and decides what gets
  # published. docker-nginx-lego analyses actions for exactly this reason.
  analyze:
    name: "Analyze (${{ matrix.language }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [go, actions]
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        if: matrix.language == 'go'
        with:
          go-version-file: go.mod

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cb06a0a8527b2c6970741b3a0baa15231dc74a4c # v4.34.1
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Autobuild
        if: matrix.language == 'go'
        uses: github/codeql-action/autobuild@cb06a0a8527b2c6970741b3a0baa15231dc74a4c # v4.34.1

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@cb06a0a8527b2c6970741b3a0baa15231dc74a4c # v4.34.1
        with:
          category: "/language:${{ matrix.language }}"

  # One stable context for branch protection to require. A matrix produces a
  # check per language, so the names move whenever the matrix does; this does
  # not.
  codeql_status:
    name: "CodeQL status"
    needs: [analyze]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Check results
        env:
          RESULT: ${{ needs.analyze.result }}
        run: |
          echo "analyze: $RESULT"
          case "$RESULT" in
            success|skipped) ;;
            *) echo "::error::CodeQL analysis did not succeed"; exit 1 ;;
          esac
          echo "CodeQL analysis succeeded or was skipped"
