name: update-dockerhub-description

# Docker Hub's repository page is the first thing most people see, and it goes
# stale silently. This keeps it in step with the README.
#
# It needs DOCKERHUB_PASSWORD — the account password, not a PAT. Hub access
# tokens return 403 against the Hub web API that serves the description, which
# is a long-standing quirk rather than anything we can work around.

on:
  push:
    branches: [main]
    paths:
      - "docs/dockerhub_description.md"
      - ".github/workflows/update_dockerhub_description.yaml"
  workflow_dispatch:
  # Called by the release workflow, so the Hub page is refreshed with every
  # release without the account password ever entering the release environment.
  # Environment scoping is per job: the job below reads the password from
  # dockerhub-metadata, and no job in the calling workflow can reach it.
  workflow_call:
    inputs:
      version:
        description: "Version being released, for the summary. Optional."
        required: false
        type: string
        default: ""
      page_artifact:
        description: "Artifact holding the page already composed by the release, with its vulnerability scan rendered in."
        required: false
        type: string
        default: ""
    # Declared explicitly rather than using `secrets: inherit`, so the caller
    # hands over this one value and nothing else.
    #
    # DOCKERHUB_PASSWORD is deliberately NOT declared. It is an environment
    # secret of dockerhub-metadata, which the job below declares; release #6
    # declared it here without passing it and the job read it as empty. It is
    # left to the environment alone, and .github/actionlint.yaml says why
    # actionlint is told to expect that. The same holds for the withdraw
    # workflow's environment secrets, so this job's next run is also the proof
    # that the release's rollback can reach its credentials.
    secrets:
      DOCKERHUB_USERNAME:
        required: false

# Serialise: two pushes in quick succession should not race to set the
# description.
concurrency:
  group: dockerhub-description
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    name: "Update Docker Hub description"
    runs-on: ubuntu-latest
    # Its own environment, not `release`. The account password is the strongest
    # credential this project holds — it can do anything the account can, not
    # just push tags — so it is scoped to the one job that needs it. Nothing in
    # the release workflow can read it, because a job may declare only one
    # environment and those jobs declare `release`.
    #
    # Put DOCKERHUB_PASSWORD in the `dockerhub-metadata` environment and nowhere
    # else. Give that environment a required reviewer too, so every use of the
    # account password is a deliberate click.
    environment: dockerhub-metadata
    # Defined once and used both to publish and to verify. Two copies of this
    # string would let the page say one thing while the check asserted another,
    # which is the same shape of fault as a green job that wrote nothing.
    #
    # Docker Hub indexes this line and shows it in search results, so it carries
    # the terms someone would actually search for. The limit is 100 characters.
    env:
      SHORT_DESC: "cert-manager DNS-01 webhook solver for freemyip.com — Let's Encrypt wildcards on k8s"
      README_PATH: ./docs/dockerhub_description.md
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # The release renders the vulnerability scan into this page and hands the
      # result over as an artifact. It has to come from there rather than from
      # the checkout: this job checks out the commit the run started from, which
      # cannot contain the scan of the release that run is publishing.
      #
      # Optional and non-fatal — a dispatched run has no artifact, and a release
      # whose scan step failed should still get its page refreshed with what is
      # committed.
      - name: Take the page composed by the release
        if: inputs.page_artifact != ''
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.page_artifact }}
          # The artifact carries both pages at their repository paths, so this
          # lands docs/dockerhub_description.md exactly where README_PATH points.
          path: .

      - name: Note whether the page carries a scan
        run: |
          if grep -q 'Populated by the release workflow' "$README_PATH"; then
            echo "::warning::the page still holds the placeholder — Docker Hub will show no vulnerability scan"
          else
            echo "the page carries a rendered scan"
          fi

      # Skipping when unconfigured was written for the period before the
      # password existed. It then hid a live failure for a whole release: the
      # value arrived empty, this step skipped, and a job named "Update Docker
      # Hub description" went green having updated nothing.
      #
      # So it now skips only when nothing depends on it. A release passes
      # `version`, and on a release the configuration must be there — a missing
      # value is a failure, named, not a shrug. It says *which* value is
      # missing, because "A or B not set" is not something anyone can act on.
      - name: Check configuration
        id: check
        env:
          HUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          HUB_PW: ${{ secrets.DOCKERHUB_PASSWORD }}
          HUB_REPO: ${{ vars.DOCKERHUB_REPOSITORY }}
          RELEASING: ${{ inputs.version }}
        run: |
          missing=""
          [ -z "$HUB_PW" ] && missing="${missing} DOCKERHUB_PASSWORD(environment dockerhub-metadata)"
          [ -z "$HUB_REPO" ] && missing="${missing} DOCKERHUB_REPOSITORY(repository variable)"
          if [ -n "$missing" ]; then
            if [ -n "$RELEASING" ]; then
              echo "::error::not set:${missing}. A release refreshes this page, so this cannot be skipped."
              exit 1
            fi
            echo "::warning::not set:${missing} — skipping. Set them, then dispatch this workflow again."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Fail here rather than inside the action below. A pasted secret with
          # a trailing newline makes the action fail with a message that points
          # nowhere; this names the secret without printing any part of it. The
          # action takes its inputs directly, so the value cannot be trimmed for
          # it — passing a corrected copy through a step output would put the
          # secret somewhere it does not belong.
          reject_whitespace() {
            trimmed=$(printf '%s' "$2" | tr -d '[:space:]')
            if [ "${#trimmed}" -ne "${#2}" ]; then
              echo "::error::$1 contains whitespace — re-save it with no trailing newline"
              exit 1
            fi
          }
          reject_whitespace DOCKERHUB_USERNAME "$HUB_USER"
          reject_whitespace DOCKERHUB_PASSWORD "$HUB_PW"

          # Reported, never corrected, and never fatal. Docker Hub today wants
          # the lowercase Docker ID and rejects anything else as a malformed
          # authorization header, which looks like an encoding fault rather than
          # a wrong username. The value is passed through exactly as stored, so
          # if Docker Hub ever accepts mixed case nothing here has to change.
          if [ "$HUB_USER" != "$(printf '%s' "$HUB_USER" | tr '[:upper:]' '[:lower:]')" ]; then
            echo "::warning::DOCKERHUB_USERNAME contains uppercase. Docker Hub currently requires the lowercase Docker ID; if the calls below fail with a malformed authorization header, that is why."
          fi

      # A page written for Docker Hub, not the GitHub README: the README tells
      # people to clone the repository, which is meaningless to someone looking
      # at a registry listing.
      - name: Push the description to Docker Hub
        if: steps.check.outputs.skip != 'true'
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          "password": ${{ secrets.DOCKERHUB_PASSWORD }}
          repository: ${{ vars.DOCKERHUB_REPOSITORY }}
          readme-filepath: ${{ env.README_PATH }}
          short-description: ${{ env.SHORT_DESC }}

      # The source link on the Hub page. Set here as well as in the release, so
      # it is correct even before the first release exists.
      - name: Point the Docker Hub repository back at this repository
        if: steps.check.outputs.skip != 'true'
        env:
          HUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          HUB_PW: ${{ secrets.DOCKERHUB_PASSWORD }}
          HUB_REPO: ${{ vars.DOCKERHUB_REPOSITORY }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          # Belt and braces: the check step above already fails the job on a
          # whitespace-bearing secret, so this only guards against a value that
          # changed between steps.
          HUB_USER=$(printf '%s' "$HUB_USER" | tr -d '[:space:]')
          HUB_PW=$(printf '%s' "$HUB_PW" | tr -d '[:space:]')
          jwt=$(curl -sf -X POST "https://hub.docker.com/v2/users/login" \
            -H "Content-Type: application/json" \
            -d "{\"username\":\"${HUB_USER}\",\"password\":\"${HUB_PW}\"}" \
            | grep -o '"token":"[^"]*"' | sed 's/"token":"//; s/"//')
          if [ -z "$jwt" ]; then
            echo "::warning::could not authenticate to the Docker Hub web API — vcs_url not updated"
            exit 0
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' -X PATCH \
            "https://hub.docker.com/v2/repositories/${HUB_REPO}/" \
            -H "Authorization: Bearer ${jwt}" \
            -H "Content-Type: application/json" \
            -d "{\"vcs_url\":\"https://github.com/${REPO}\"}")
          echo "vcs_url update -> ${code}"

      # The page is what this job exists to change, so its success has to mean
      # the page now holds what we sent. "Not empty" would pass on a stale page,
      # a truncated upload, or somebody else's text — the action can only report
      # what it transmitted, never what Docker Hub stored.
      - name: Verify the page matches what was published
        if: steps.check.outputs.skip != 'true'
        env:
          HUB_REPO: ${{ vars.DOCKERHUB_REPOSITORY }}
        run: |
          set -uo pipefail
          body=$(curl -sS --retry 3 --retry-all-errors --max-time 30 \
            "https://hub.docker.com/v2/repositories/${HUB_REPO}/" || echo "")
          if [ -z "$body" ]; then
            echo "::error::could not read the Docker Hub repository back — cannot confirm the page was updated"
            exit 1
          fi

          # $( ) strips trailing newlines from both sides, so a difference in
          # the final newline alone is not reported as a mismatch.
          want=$(cat "$README_PATH")
          got=$(printf '%s' "$body" | jq -r '.full_description // ""')
          if [ "$got" != "$want" ]; then
            echo "::error::the Docker Hub page does not match ${README_PATH} (sent ${#want} chars, page has ${#got})"
            echo "First differences (< expected, > on the page):"
            diff <(printf '%s\n' "$want") <(printf '%s\n' "$got") | head -20
            exit 1
          fi

          got_short=$(printf '%s' "$body" | jq -r '.description // ""')
          if [ "$got_short" != "$SHORT_DESC" ]; then
            echo "::error::the Docker Hub short description is '${got_short}', expected '${SHORT_DESC}'"
            exit 1
          fi

          # The source link is set by the step above; a 403 there is reported as
          # a warning, so confirm the value rather than assuming it took.
          got_vcs=$(printf '%s' "$body" | jq -r '.vcs_url // ""')
          want_vcs="https://github.com/${GITHUB_REPOSITORY}"
          [ "$got_vcs" = "$want_vcs" ] \
            || echo "::warning::vcs_url is '${got_vcs}', expected '${want_vcs}'"

          echo "Docker Hub page matches ${README_PATH} (${#want} characters) and the short description"

      - name: Summarise
        if: always()
        env:
          SKIPPED: ${{ steps.check.outputs.skip }}
          VERSION: ${{ inputs.version }}
          HUB_REPO: ${{ vars.DOCKERHUB_REPOSITORY }}
        run: |
          {
            if [ -n "$VERSION" ]; then
              echo "### Docker Hub page — release ${VERSION}"
            else
              echo "### Docker Hub page"
            fi
            echo ""
            if [ "$SKIPPED" = "true" ]; then
              echo "Skipped: DOCKERHUB_PASSWORD is not set in the dockerhub-metadata environment."
            else
              echo "Description and source link refreshed for \`${HUB_REPO}\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
