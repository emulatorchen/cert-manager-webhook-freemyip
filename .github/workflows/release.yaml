name: release

# Releases are started by a person, never by a ref appearing. Every job that
# can publish declares environment: release, so it parks for a reviewer before
# any credential is exposed to it.
#
# That gate is the supply-chain control, and it holds by construction:
# GitHub's approval endpoint accepts only OAuth app tokens and classic PATs
# with repo scope, and required reviewers can only be users or teams. GITHUB_TOKEN
# is an App installation token and is not a reviewer, so no job in this workflow
# — compromised or not — can approve its own deployment. Keep it that way: never
# store a classic repo-scoped PAT belonging to a reviewer as a secret here.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the leading v (e.g. 0.2.0). Blank uses the chart appVersion."
        required: false
        default: ""
      notes:
        description: "Release notes. Blank auto-generates them from merged pull requests; text is prepended before the generated notes unless override is checked."
        required: false
        default: ""
      override_notes:
        description: "Use only the notes above, discarding the auto-generated ones"
        type: boolean
        default: false
      block_severity:
        description: "Severities that block the release. Start at CRITICAL; tighten to CRITICAL,HIGH once the pipeline is proven."
        type: choice
        options:
          - CRITICAL
          - CRITICAL,HIGH
        default: CRITICAL
      skip_security_scan:
        description: "Skip the vulnerability gate entirely — emergency hotfix only, still needs reviewer approval"
        type: boolean
        default: false

# A release must never race another, and must never be cancelled half-published.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve:
    name: "Resolve version"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      ghcr_image: ${{ steps.v.outputs.ghcr_image }}
      # Two forms on purpose: the registry wants docker.io/owner/name, the
      # Docker Hub web API wants owner/name.
      hub_image: ${{ steps.v.outputs.hub_image }}
      hub_repo: ${{ steps.v.outputs.hub_repo }}
      charts: ${{ steps.v.outputs.charts }}
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # ghcr.io rejects uppercase in repository names, but github.repository
      # and github.repository_owner preserve the owner's casing.
      - name: Resolve version and targets
        id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
          HUB_REPO: ${{ vars.DOCKERHUB_REPOSITORY }}
        run: |
          set -euo pipefail
          version="$INPUT_VERSION"
          if [ -z "$version" ]; then
            version=$(grep -m1 '^appVersion:' charts/cert-manager-webhook-freemyip/Chart.yaml \
                      | sed 's/^appVersion:[[:space:]]*//; s/"//g')
          fi
          [ -n "$version" ] || { echo "could not resolve a version"; exit 1; }

          # The chart repository publishes whatever Chart.yaml's `version:`
          # says — it does not see this input. If the two disagree, the images
          # and the GitHub release carry one number while `helm repo add` users
          # get another. Caught here rather than discovered in the index.
          chart_version=$(grep -m1 '^version:' charts/cert-manager-webhook-freemyip/Chart.yaml \
                          | sed 's/^version:[[:space:]]*//; s/"//g')
          if [ "$chart_version" != "$version" ]; then
            echo "::error::releasing ${version} but Chart.yaml says version: ${chart_version}. The chart repository would publish ${chart_version}. Update Chart.yaml, or release the version it already names."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v${version}" >/dev/null 2>&1; then
            echo "tag v${version} already exists — bump the version, or delete the tag to re-release"
            exit 1
          fi
          # chart-releaser tags independently, under the chart's name. It is a
          # separate name space that fails on its own, and it fails *after* the
          # image has been pushed — so both names have to be clear up front.
          if git ls-remote --exit-code --tags origin "refs/tags/cert-manager-webhook-freemyip-${version}" >/dev/null 2>&1; then
            echo "tag cert-manager-webhook-freemyip-${version} already exists — the chart publish would fail with the image already pushed. Delete it, or bump the version."
            exit 1
          fi
          if [ -z "$HUB_REPO" ]; then
            echo "repository variable DOCKERHUB_REPOSITORY is not set (expected e.g. emulator/cert-manager-webhook-freemyip)"
            exit 1
          fi
          # Refuse a version that is already published somewhere it cannot be
          # overwritten. A Docker Hub tag rule makes version tags immutable, so
          # discovering the clash at push time means a half-published run and a
          # version number burned. Checked through the public API, so this needs
          # no credentials and runs before the reviewer is asked for anything.
          #
          # ghcr is deliberately NOT checked: its tags are overwritable, so
          # leftovers from a failed run must not block a legitimate retry of the
          # same version.
          # A bare curl under `set -e` turns a DNS blip into a failed release,
          # and treats every non-200 as "safe to proceed" — including the 401
          # or 404 you get from a private repository or a typo in the variable,
          # where the guard would be protecting nothing. Retry, and only accept
          # a clean 200 or 404 as an answer.
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            --retry 3 --retry-all-errors --max-time 30 \
            "https://hub.docker.com/v2/repositories/${HUB_REPO}/tags/${version}/" || echo "000")
          case "$code" in
            200)
              echo "::error::${HUB_REPO}:${version} is already published on Docker Hub. Delete that tag or pick another version — a release must never overwrite a published one."
              exit 1
              ;;
            404)
              echo "${HUB_REPO}:${version} is not published yet"
              ;;
            *)
              echo "::error::could not determine whether ${HUB_REPO}:${version} is already published (HTTP ${code}). Refusing to release blind — check DOCKERHUB_REPOSITORY and that the repository is public."
              exit 1
              ;;
          esac

          {
            echo "version=${version}"
            echo "tag=v${version}"
            echo "ghcr_image=ghcr.io/${GITHUB_REPOSITORY,,}"
            # Fully qualified for the registry and for attestation subjects,
            # which reject a bare owner/name.
            echo "hub_image=docker.io/${HUB_REPO}"
            echo "hub_repo=${HUB_REPO}"
            echo "charts=oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing ${version} to ghcr.io/${GITHUB_REPOSITORY,,} and ${HUB_REPO}"

  # Everything the reviewer should have read before pressing approve, in one
  # place. Informational only — it never blocks. The blocking equivalents are
  # workflow_scan and scan below.
  security_preflight:
    # Not "... summary": GitHub appends the word itself, so the heading above
    # the report read "Security preflight summary summary".
    name: "Security preflight"
    needs: resolve
    if: always() && needs.resolve.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install actionlint v1.7.12 and zizmor v1.23.1
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/bin"
          curl -fsSL --retry 3 --retry-all-errors -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz" | sha256sum -c -
          tar xzf actionlint.tar.gz actionlint
          mv actionlint "${RUNNER_TEMP}/bin/"

          curl -fsSL --retry 3 --retry-all-errors -o zizmor.tar.gz \
            "https://github.com/zizmorcore/zizmor/releases/download/v1.23.1/zizmor-x86_64-unknown-linux-gnu.tar.gz"
          echo "67a8df0a14352dd81882e14876653d097b99b0f4f6b6fe798edc0320cff27aff  zizmor.tar.gz" | sha256sum -c -
          tar xzf zizmor.tar.gz
          mv zizmor "${RUNNER_TEMP}/bin/"

          rm -f actionlint.tar.gz zizmor.tar.gz
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"

      # Both tools colour their output, and a step summary is Markdown, not a
      # terminal — the escape sequences render as literal `?[32m` noise that
      # makes the report harder to read than no report at all. NO_COLOR asks
      # them not to emit it; the sed strips anything that slips through, such
      # as the banner zizmor prints regardless.
      - name: Run the analysers
        env:
          NO_COLOR: "1"
        run: |
          zizmor --format plain --no-online-audits .github/workflows/ 2>&1 \
            | sed 's/\x1b\[[0-9;]*m//g' > /tmp/zizmor.txt || true
          actionlint -no-color .github/workflows/*.y*ml 2>&1 \
            | sed 's/\x1b\[[0-9;]*m//g' > /tmp/actionlint.txt || true

      - name: List open security issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          gh issue list --repo "$REPO" --label security --state open \
            --json number,title --jq '.[] | "  #\(.number): \(.title)"' \
            > /tmp/issues.txt 2>/dev/null || true

      - name: Write the summary
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          {
            echo "## Security preflight — ${VERSION}"
            echo ""
            echo "Read this before approving the release environment gate."
            echo ""
            echo "### Workflow static analysis (zizmor)"
            if [ -s /tmp/zizmor.txt ]; then
              echo '```'; cat /tmp/zizmor.txt; echo '```'
            else
              echo "No findings."
            fi
            echo ""
            echo "### Workflow linting (actionlint)"
            if [ -s /tmp/actionlint.txt ]; then
              echo '```'; cat /tmp/actionlint.txt; echo '```'
            else
              echo "No findings."
            fi
            echo ""
            echo "### Open security issues"
            if [ -s /tmp/issues.txt ]; then
              echo "Approving releases with these still open:"
              echo '```'; cat /tmp/issues.txt; echo '```'
            else
              echo "None open."
            fi
            echo ""
            echo "---"
            echo "_Informational only. This job never blocks a release._"
          } >> "$GITHUB_STEP_SUMMARY"

  verify:
    name: "Build and vet"
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - name: Lint and render the chart
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          helm lint charts/cert-manager-webhook-freemyip
          helm template release-check charts/cert-manager-webhook-freemyip \
            --set image.tag="$VERSION" > /dev/null

  # The workflows are part of the supply chain too: they hold the credentials
  # and decide what gets published. Scanning the artifact but not the thing
  # that publishes it leaves the more privileged half unchecked.
  workflow_scan:
    name: "Workflow security gate"
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # Extracted onto PATH rather than installed system-wide: each tool is
      # used by one step, so elevating for it buys nothing.
      - name: Install actionlint v1.7.12 and zizmor v1.23.1
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/bin"
          curl -fsSL --retry 3 --retry-all-errors -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz" | sha256sum -c -
          tar xzf actionlint.tar.gz actionlint
          mv actionlint "${RUNNER_TEMP}/bin/"

          curl -fsSL --retry 3 --retry-all-errors -o zizmor.tar.gz \
            "https://github.com/zizmorcore/zizmor/releases/download/v1.23.1/zizmor-x86_64-unknown-linux-gnu.tar.gz"
          echo "67a8df0a14352dd81882e14876653d097b99b0f4f6b6fe798edc0320cff27aff  zizmor.tar.gz" | sha256sum -c -
          tar xzf zizmor.tar.gz
          mv zizmor "${RUNNER_TEMP}/bin/"

          rm -f actionlint.tar.gz zizmor.tar.gz
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"

      - name: Scan the workflows
        env:
          BLOCK_SEVERITY: ${{ inputs.block_severity }}
          # Needed for the pin-versus-tag check; without it that check skips and
          # a SHA pinned to the wrong version would sail through the gate.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/validate.sh

  # The release proves the thing it is about to publish actually works, in the
  # run that publishes it — a real ACME order against Let's Encrypt staging,
  # through kind, cert-manager and this chart. docker-nginx-lego gates all of
  # its publishes on the same check.
  #
  # Job-level concurrency, not workflow-level: freemyip stores exactly one TXT
  # value per domain, so this must never run beside the integration-tests
  # workflow, which shares this group.
  integration_check:
    name: "Integration test (DNS-01 staging certificate)"
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: freemyip-dns
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Check configuration
        id: check
        env:
          TOKEN: ${{ secrets.FREEMYIP_TOKEN }}
          DOMAIN: ${{ vars.FREEMYIP_DOMAIN }}
          EMAIL: ${{ secrets.CERTBOT_EMAIL }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$DOMAIN" ] || [ -z "$EMAIL" ]; then
            echo "::error::FREEMYIP_TOKEN, FREEMYIP_DOMAIN or CERTBOT_EMAIL is missing — a release must not publish untested"
            exit 1
          fi

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build the webhook image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          pull: true
          tags: webhook:release-check

      - uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          cluster_name: release-check

      - name: Install cert-manager and the webhook
        env:
          TOKEN: ${{ secrets.FREEMYIP_TOKEN }}
          EMAIL: ${{ secrets.CERTBOT_EMAIL }}
        run: |
          set -euo pipefail
          kind load docker-image webhook:release-check --name release-check

          helm repo add jetstack https://charts.jetstack.io
          helm repo update jetstack

          # cert-manager checks the record itself before asking Let's Encrypt to,
          # by default against the zone's authoritative nameservers. From inside
          # kind on a runner that lookup does not complete, so the challenge sits
          # pending until the order expires. Pin the self-check to recursive
          # resolvers reachable over the path that works.
          cat > /tmp/cm-values.yaml <<'EOF'
          crds:
            enabled: true
          extraArgs:
            - --dns01-recursive-nameservers-only
            - --dns01-recursive-nameservers=1.1.1.1:53,8.8.8.8:53
          EOF

          helm upgrade --install cert-manager jetstack/cert-manager \
            --namespace cert-manager --create-namespace \
            -f /tmp/cm-values.yaml \
            --wait --timeout 10m

          # A values file rather than --set: the token never reaches the process
          # list, where anything on the runner could read it.
          umask 077
          cat > /tmp/values.yaml <<EOF
          image:
            repository: webhook
            tag: release-check
            pullPolicy: Never
          freemyip:
            "token": "${TOKEN}"
          clusterIssuer:
            email: "${EMAIL}"
            staging:
              create: true
          EOF

          helm upgrade --install cert-manager-webhook-freemyip \
            charts/cert-manager-webhook-freemyip \
            --namespace cert-manager \
            -f /tmp/values.yaml \
            --wait --timeout 5m
          rm -f /tmp/values.yaml

      - name: Request a staging certificate
        env:
          DOMAIN: ${{ vars.FREEMYIP_DOMAIN }}
        run: |
          set -euo pipefail
          # One DNS name only: freemyip stores a single TXT value per domain.
          cat <<EOF | kubectl apply -f -
          apiVersion: cert-manager.io/v1
          kind: Certificate
          metadata:
            name: release-check
            namespace: default
          spec:
            secretName: release-check-tls
            issuerRef:
              name: cert-manager-webhook-freemyip-staging
              kind: ClusterIssuer
            dnsNames:
              - ${DOMAIN}
          EOF
          kubectl wait --for=condition=Ready certificate/release-check -n default --timeout=8m

      - name: Show what happened on failure
        if: failure()
        run: |
          kubectl describe certificate/release-check -n default || true
          kubectl get certificaterequest,order,challenge -A || true
          kubectl describe challenge -A || true
          kubectl describe order -A || true
          kubectl logs -n cert-manager -l app.kubernetes.io/name=cert-manager-webhook-freemyip --tail=200 || true
          kubectl logs -n cert-manager -l app=cert-manager --tail=200 || true

      - name: Clean up the challenge record
        if: always()
        run: kubectl delete certificate/release-check -n default --ignore-not-found || true

  scan:
    name: "Vulnerability gate"
    needs: [resolve, verify, integration_check]
    if: ${{ !inputs.skip_security_scan }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      # Reachability-aware: only reports advisories our code can actually call.
      #
      # The Go advisory database carries no severity, so this cannot be filtered
      # the way the image scan can. It follows the same bar instead: at
      # CRITICAL it reports and lets the release through, at CRITICAL,HIGH it
      # blocks. Findings are always printed either way.
      - name: govulncheck
        env:
          BLOCK: ${{ inputs.block_severity }}
        run: |
          if go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...; then
            echo "no reachable vulnerabilities"
          else
            case "$BLOCK" in
              *HIGH*)
                echo "::error::govulncheck found reachable vulnerabilities and the bar is ${BLOCK}"
                exit 1
                ;;
              *)
                echo "::warning::govulncheck found reachable vulnerabilities — not blocking at the ${BLOCK} bar"
                ;;
            esac
          fi

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build the release image locally for scanning
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          # Force a fresh base pull, so the thing scanned here is the thing the
          # publish job builds rather than a cached layer.
          pull: true
          tags: scan-target:release

      # Two passes, deliberately. The first is the gate and is the only one
      # that can fail the run; its bar is chosen per-run so it can be tightened
      # from CRITICAL to CRITICAL,HIGH without editing this file. The second
      # always records the full CRITICAL,HIGH picture to the security tab, so
      # raising the bar later is an informed decision rather than a guess.
      #
      # ignore-unfixed: a CVE with no upstream fix cannot be acted on, and
      # blocking on it means the gate can never be tightened. Accepting one
      # deliberately is what .trivyignore is for.
      - name: Vulnerability gate
        uses: lhotari/sandboxed-trivy-action@f01374b6cc3bf7264ab238293e94f6db7ada6dd0 # v1.0.2
        with:
          scan-ref: scan-target:release
          severity: ${{ inputs.block_severity }}
          ignore-unfixed: true
          trivyignores: .trivyignore
          format: table
          exit-code: 1

      - name: Record the full picture
        if: always()
        uses: lhotari/sandboxed-trivy-action@f01374b6cc3bf7264ab238293e94f6db7ada6dd0 # v1.0.2
        with:
          scan-ref: scan-target:release
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore
          format: sarif
          output: trivy-release.sarif
          exit-code: 0

      - name: Upload scan results
        if: always()
        uses: github/codeql-action/upload-sarif@cb06a0a8527b2c6970741b3a0baa15231dc74a4c # v4.34.1
        with:
          sarif_file: trivy-release.sarif
          category: trivy-release

  # Packages only. Nothing reaches a registry before the gate — a chart at the
  # version number is exactly as pullable as an image at it.
  publish_chart:
    name: "Package the chart"
    needs: [resolve, security_preflight, verify, workflow_scan, integration_check, scan]
    if: |
      always() &&
      needs.resolve.result == 'success' &&
      needs.verify.result == 'success' &&
      needs.workflow_scan.result == 'success' &&
      needs.integration_check.result == 'success' &&
      (needs.security_preflight.result == 'success' || needs.security_preflight.result == 'skipped') &&
      (needs.scan.result == 'success' || needs.scan.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Package the chart
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          helm package charts/cert-manager-webhook-freemyip \
            --version "$VERSION" \
            --app-version "$VERSION"

      - name: Keep the packaged chart for the release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chart
          path: cert-manager-webhook-freemyip-*.tgz
          if-no-files-found: error

  # Aggregate every gate and publish job before the release is announced, so a
  # partial publish never gets a GitHub release attached to it.
  release_gate:
    name: "Release gate"
    needs: [resolve, security_preflight, verify, workflow_scan, integration_check, scan, publish_chart]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Check every gate and publish job
        env:
          # Through env, never interpolated into the shell: an expansion
          # inside a run block is a code-injection sink.
          REQUIRED: >-
            ${{ needs.resolve.result }} ${{ needs.verify.result }}
            ${{ needs.workflow_scan.result }} ${{ needs.integration_check.result }}
            ${{ needs.publish_chart.result }}
          OPTIONAL: >-
            ${{ needs.scan.result }} ${{ needs.security_preflight.result }}
        run: |
          echo "required: $REQUIRED"
          echo "optional: $OPTIONAL"
          for r in $REQUIRED; do
            [ "$r" = "success" ] || { echo "::error::release blocked: a required job did not succeed"; exit 1; }
          done
          # These two are the only jobs allowed to be skipped: scan via
          # skip_security_scan, and the preflight because it never blocks.
          for r in $OPTIONAL; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::release blocked: a gate job failed"; exit 1 ;;
            esac
          done
          echo "all gates passed"

      # Fail closed if the approval environment is not actually protected.
      # GitHub creates a missing environment silently, with no rules, the first
      # time a job names one — so a typo here, or this workflow running in a
      # fork or a fresh clone, would publish a release with nobody approving
      # anything. The approval job existing is not the same as it asking.
      - name: Verify the approval environment requires a reviewer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          n=$(gh api "repos/${REPO}/environments/release-approval" \
                --jq '[.protection_rules[]? | select(.type=="required_reviewers")] | length' 2>/dev/null) || n=""
          if [ -z "$n" ]; then
            echo "::error::cannot read the release-approval environment. Create it with at least one required reviewer before releasing."
            exit 1
          fi
          if [ "$n" = "0" ]; then
            echo "::error::release-approval has no required reviewer, so the approval below would be granted automatically. Add one."
            exit 1
          fi
          echo "release-approval requires ${n} reviewer(s)"

  # THE approval, and the only one on a successful release.
  #
  # It holds no secrets, runs no registry command and writes nothing. Its whole
  # job is to be the thing GitHub asks about, before anything exists to undo.
  # Reject it and both registries, gh-pages and the release list are untouched.
  #
  # It sits in its own environment rather than `release` because GitHub prompts
  # per *job*, and every publishing job needs `release` to read the Docker Hub
  # token. With the reviewer on `release` itself, each of those jobs asked
  # separately — seven clicks for one decision. The reviewer moves here; the
  # token stays there; and nothing can reach the token except through this job,
  # which release_gate has just proved is actually protected.
  release_approval:
    name: "⚠️ Approve to PUBLISH — nothing has been written yet"
    needs: [resolve, release_gate]
    if: always() && needs.release_gate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release-approval
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Record the decision
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          {
            echo "## Approved: publishing ${VERSION}"
            echo ""
            echo "Publication order from here, each step reachable only through this one:"
            echo ""
            echo "1. image version tags on ghcr and Docker Hub — immutable, nothing points at them yet"
            echo "2. the chart on the OCI registry"
            echo "3. the chart repository index on gh-pages"
            echo "4. the GitHub release and the \`v${VERSION}\` tag"
            echo "5. \`latest\`, last of all"
          } >> "$GITHUB_STEP_SUMMARY"

  # The first write of the release.
  #
  # Version tags only, and that is the point: a version tag is inert. Nothing
  # resolves it by name until an install route advertises it, and all three
  # install routes are published after this job. `latest` is the one pointer
  # people actually follow, so it moves last, in promote_latest.
  #
  # It builds here rather than promoting something staged earlier: staging put a
  # push before the approval, and a run-scoped ghcr tag is still a write and
  # still a package version on the account. `scan` already builds this same
  # image locally (load, never push) and fails the run before the approval is
  # ever offered, so nothing is lost by building late.
  #
  # pull + no-cache: a published image is built from scratch against a freshly
  # pulled base, never from a layer cache of unknown age.
  publish_image:
    name: "Publish the image version tags"
    needs: [resolve, release_approval]
    if: always() && needs.release_approval.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: release
    permissions:
      contents: read
      packages: write
      # Both are needed by attest-build-provenance: attestations to record it,
      # and OIDC to prove to Sigstore which workflow produced the image.
      attestations: write
      "id-token": write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      # The cleanup keys off this. It is set immediately before the push, so it
      # means "a version tag may exist on Docker Hub" — the one artefact a retry
      # cannot overwrite.
      push_attempted: ${{ steps.mark.outputs.attempted }}
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # Credentials go in over stdin rather than as an action input, so they
      # never appear as a literal in the workflow file.
      - name: Log in to ghcr.io
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_PAT" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

      - name: Log in to Docker Hub
        env:
          HUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          HUB_PAT: ${{ secrets.DOCKERHUB_RELEASE_TOKEN }}
        run: |
          user=$(printf '%s' "$HUB_USER" | tr -d '[:space:]')
          pat=$(printf '%s' "$HUB_PAT" | tr -d '[:space:]')
          [ "$user" = "$(printf '%s' "$user" | tr '[:upper:]' '[:lower:]')" ] || \
            echo "::warning::DOCKERHUB_USERNAME contains uppercase. Docker Hub currently requires the lowercase Docker ID; if the login below fails with a malformed authorization header, that is why."
          if [ -z "$user" ] || [ -z "$pat" ]; then
            echo "::error::Docker Hub username or token is empty. The username must be the Docker ID, not an email address."
            exit 1
          fi
          printf '%s' "$pat" | docker login docker.io -u "$user" --password-stdin

      # Set before the push, not after. buildx writes the tags itself, and a
      # failure part-way can still leave a Docker Hub version tag behind;
      # claiming nothing was pushed would silence the cleanup on exactly the
      # run that needs it.
      - name: Record that a version tag is about to exist
        id: mark
        run: echo "attempted=true" >> "$GITHUB_OUTPUT"

      - name: Build and publish the version tags
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          no-cache: true
          provenance: mode=max
          sbom: true
          tags: |
            ${{ needs.resolve.outputs.ghcr_image }}:${{ needs.resolve.outputs.version }}
            ${{ needs.resolve.outputs.hub_image }}:${{ needs.resolve.outputs.version }}

      # One digest recorded under both names, so verification succeeds whichever
      # registry the image was pulled from.
      - name: Attest the ghcr image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ needs.resolve.outputs.ghcr_image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Attest the Docker Hub image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ needs.resolve.outputs.hub_image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: false

      # The build action reports the digest it pushed. It does not prove either
      # registry now serves that digest under the version tag — and a tag
      # resolving to the wrong image is worse than a tag that is missing,
      # because everything downstream would publish and advertise it.
      - name: Verify both registries serve the built digest
        env:
          GHCR_IMAGE: ${{ needs.resolve.outputs.ghcr_image }}
          HUB_IMAGE: ${{ needs.resolve.outputs.hub_image }}
          VERSION: ${{ needs.resolve.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          for ref in "${GHCR_IMAGE}:${VERSION}" "${HUB_IMAGE}:${VERSION}"; do
            got=$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$ref")
            if [ "$got" != "$DIGEST" ]; then
              echo "::error::${ref} resolves to ${got}, expected ${DIGEST}"
              exit 1
            fi
            echo "${ref} -> ${got}"
          done

  # The chart at its version number, pushed only once the image it references
  # actually exists. The packaged file comes from before the gate; this job
  # only uploads it.
  publish_chart_oci:
    name: "Publish the chart to the OCI registry"
    needs: [resolve, release_approval, publish_image]
    if: |
      always() && needs.release_approval.result == 'success' &&
      needs.publish_image.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: chart

      - name: Push the packaged chart
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_PAT: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.resolve.outputs.version }}
          CHARTS: ${{ needs.resolve.outputs.charts }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_PAT" | helm registry login ghcr.io -u "$GHCR_USER" --password-stdin
          helm push "cert-manager-webhook-freemyip-${VERSION}.tgz" "$CHARTS"

      # `helm push` exiting 0 says the upload was accepted, not that the
      # registry will serve this version to an install. Pulled back and read,
      # the same way the chart repository index is.
      - name: Verify the OCI registry serves this chart
        env:
          CHARTS: ${{ needs.resolve.outputs.charts }}
          VERSION: ${{ needs.resolve.outputs.version }}
          HUB_IMAGE: ${{ needs.resolve.outputs.hub_image }}
        run: |
          set -euo pipefail
          rm -rf /tmp/oci && mkdir -p /tmp/oci
          helm pull "${CHARTS}/cert-manager-webhook-freemyip" --version "$VERSION" -d /tmp/oci
          f="/tmp/oci/cert-manager-webhook-freemyip-${VERSION}.tgz"
          [ -f "$f" ] || { echo "::error::helm pull returned no chart for ${VERSION} from ${CHARTS}"; exit 1; }
          got_v=$(tar -xzOf "$f" cert-manager-webhook-freemyip/Chart.yaml | yq -r '.version')
          got_av=$(tar -xzOf "$f" cert-manager-webhook-freemyip/Chart.yaml | yq -r '.appVersion')
          got_img=$(tar -xzOf "$f" cert-manager-webhook-freemyip/values.yaml | yq -r '.image.repository')
          fail=0
          [ "$got_v" = "$VERSION" ]     || { echo "::error::OCI chart is version ${got_v}, expected ${VERSION}"; fail=1; }
          [ "$got_av" = "$VERSION" ]    || { echo "::error::OCI chart has appVersion ${got_av}, expected ${VERSION}"; fail=1; }
          [ "$got_img" = "$HUB_IMAGE" ] || { echo "::error::OCI chart points at ${got_img}, expected ${HUB_IMAGE}"; fail=1; }
          [ "$fail" = "0" ] || exit 1
          echo "${CHARTS} serves ${VERSION}: chart ${got_v}, appVersion ${got_av}, image ${got_img}"

  # The chart repository index, last of the three publishes: it advertises a
  # version, so the image and the OCI chart must already be there or a
  # `helm install` from it fails to pull.
  #
  # packages_with_index puts the .tgz on the publishing branch beside
  # index.yaml, so the index serves files from the branch rather than from
  # release assets. It also implies --skip-existing, so a retry no longer trips
  # over a release left behind by a failed attempt.
  #
  # It does NOT stop the action creating a release of its own: cr upload runs
  # regardless, so each version gets both `v<version>` from github_release and
  # `cert-manager-webhook-freemyip-<version>` from here. Suppressing that would
  # mean owning the index commit and push ourselves, which needs a credential
  # decision on a checkout that deliberately keeps none.
  publish_chart_index:
    name: "Publish the chart repository index"
    needs: [resolve, release_approval, publish_image, publish_chart_oci]
    if: |
      always() && needs.release_approval.result == 'success' &&
      needs.publish_image.result == 'success' &&
      needs.publish_chart_oci.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # Skipped rather than failed until the branch exists, so a repository not
      # yet set up for Pages still releases everything else.
      - name: Check for the gh-pages branch
        id: pages
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::no gh-pages branch — the chart is still on the OCI registry and attached to the release, but helm repo add will not work. Create the branch and enable Pages."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      # chart-releaser commits the index, so git needs an identity. Attributed
      # to the bot: these are machine-generated commits and do not belong in a
      # person's contribution history.
      - name: Give git an identity for the index commit
        if: steps.pages.outputs.present == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Publish to the GitHub Pages chart repository
        if: steps.pages.outputs.present == 'true'
        uses: helm/chart-releaser-action@cae68fefc6b5f367a0275617c9f83181ba54714f # v1.7.0
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          charts_dir: charts
          packages_with_index: true

      # The action above can report success without publishing anything: it
      # skips silently when charts/ is unchanged since the last tag, and its
      # index step is skipped entirely by some input combinations. Both leave a
      # green job whose name promises an index that nobody updated — and
      # the publish jobs after it all key off that success. So the
      # index is read back and checked to actually advertise this version.
      # Checked the way a user would experience it, not by grepping for the
      # version string. A string appearing in index.yaml proves nothing about
      # what `helm install` would actually get: the entry has to be reachable,
      # the file it names has to download, and the chart inside it has to be
      # this version pointing at the image this release just published.
      #
      # Three separate faults have hidden behind a weaker check — chart-releaser
      # skipping silently, the index never being written, and an entry surviving
      # from an earlier run — and every one of them leaves the version string
      # present.
      - name: Verify the chart repository serves this release
        if: steps.pages.outputs.present == 'true'
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          HUB_IMAGE: ${{ needs.resolve.outputs.hub_image }}
          PAGES: https://${{ github.repository_owner }}.github.io/cert-manager-webhook-freemyip
        run: |
          set -euo pipefail
          command -v yq >/dev/null 2>&1 || { echo "::error::yq is not available on this runner"; exit 1; }

          # 1. the index is fetchable over the URL `helm repo add` is given
          curl -fsSL --retry 3 --retry-all-errors --max-time 60 "${PAGES}/index.yaml" -o index.yaml \
            || { echo "::error::${PAGES}/index.yaml is not fetchable. helm repo add would fail."; exit 1; }

          # 2. it has an entry for this version, and that entry names a file
          url=$(V="$VERSION" yq -r \
            '.entries["cert-manager-webhook-freemyip"][] | select(.version == strenv(V)) | .urls[0] // ""' \
            index.yaml)
          if [ -z "$url" ]; then
            echo "::error::index.yaml has no entry for ${VERSION}. The chart repository was not updated, so helm repo add users would not see this release."
            exit 1
          fi
          case "$url" in
            http*) full="$url" ;;
            *)     full="${PAGES}/${url}" ;;
          esac

          # 3. that file downloads
          curl -fsSL --retry 3 --retry-all-errors --max-time 60 "$full" -o chart.tgz \
            || { echo "::error::the index advertises ${full}, which does not download. Every helm install would fail at fetch."; exit 1; }

          # 4. and it is *our* chart, at this version, pointing at the image
          #    this run published. Read straight out of the archive so this
          #    needs no helm on the runner.
          got_v=$(tar -xzOf chart.tgz cert-manager-webhook-freemyip/Chart.yaml \
                  | yq -r '.version')
          got_av=$(tar -xzOf chart.tgz cert-manager-webhook-freemyip/Chart.yaml \
                  | yq -r '.appVersion')
          got_img=$(tar -xzOf chart.tgz cert-manager-webhook-freemyip/values.yaml \
                  | yq -r '.image.repository')
          fail=0
          [ "$got_v" = "$VERSION" ]   || { echo "::error::the published chart is version ${got_v}, expected ${VERSION}"; fail=1; }
          [ "$got_av" = "$VERSION" ]  || { echo "::error::the published chart has appVersion ${got_av}, expected ${VERSION} — it would pull the wrong image"; fail=1; }
          [ "$got_img" = "$HUB_IMAGE" ] || { echo "::error::the published chart points at ${got_img}, expected ${HUB_IMAGE}"; fail=1; }
          [ "$fail" = "0" ] || exit 1

          echo "${PAGES} serves ${VERSION}: chart ${got_v}, appVersion ${got_av}, image ${got_img}"

      # The chart repository is also a public web page, and the page describes
      # what the release serves. It is published from docs/pages/ so it goes
      # through review like everything else, and so a hand edit on the branch
      # cannot quietly become the only copy.
      #
      # Written through the contents API rather than a push: the checkout above
      # keeps no credentials on purpose, and chart-releaser owns the commit
      # before this one, so pushing a second commit from the same shell would
      # mean holding a pushable credential to race it.
      - name: Publish the page sources
        if: steps.pages.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -uo pipefail
          changed=0
          for src in docs/pages/*; do
            name=$(basename "$src")
            # The directory's own README explains the directory, not the site.
            [ "$name" = "README.md" ] && continue
            local_b64=$(base64 < "$src" | tr -d '\n')
            remote_b64=$(gh api "repos/${REPO}/contents/${name}?ref=gh-pages" \
                           --jq '.content' 2>/dev/null | tr -d '\n' || true)
            # The API returns base64 wrapped at 60 columns; compare the decoded
            # bytes so re-wrapping alone never looks like a change.
            if [ -n "$remote_b64" ] \
               && [ "$(printf '%s' "$remote_b64" | base64 -d | sha256sum | cut -d' ' -f1)" \
                  = "$(sha256sum < "$src" | cut -d' ' -f1)" ]; then
              echo "${name} unchanged"
              continue
            fi
            sha=$(gh api "repos/${REPO}/contents/${name}?ref=gh-pages" --jq '.sha' 2>/dev/null || true)
            if [ -n "$sha" ]; then
              gh api -X PUT "repos/${REPO}/contents/${name}" \
                -f message="Update ${name} for ${VERSION}" \
                -f content="$local_b64" -f sha="$sha" -f branch=gh-pages >/dev/null \
                && { echo "updated ${name}"; changed=1; } \
                || echo "::warning::could not update ${name} on gh-pages"
            else
              gh api -X PUT "repos/${REPO}/contents/${name}" \
                -f message="Add ${name}" \
                -f content="$local_b64" -f branch=gh-pages >/dev/null \
                && { echo "added ${name}"; changed=1; } \
                || echo "::warning::could not add ${name} to gh-pages"
            fi
          done
          [ "$changed" = "0" ] && echo "page sources already current"
          exit 0

  github_release:
    name: "Create GitHub release"
    # Announced last, once the image, the OCI chart and the index all serve this
    # version, so the release list never points at something not yet published.
    needs: [resolve, release_approval, publish_image, publish_chart_oci, publish_chart_index]
    if: |
      always() && needs.release_approval.result == 'success' &&
      needs.publish_image.result == 'success' &&
      needs.publish_chart_oci.result == 'success' &&
      needs.publish_chart_index.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: chart

      # gh release create makes the tag, so nothing pushes a ref before the
      # artifacts are actually published.
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.resolve.outputs.tag }}
          NOTES: ${{ inputs.notes }}
          OVERRIDE: ${{ inputs.override_notes }}
        run: |
          set -euo pipefail
          if [ -z "$NOTES" ]; then
            gh release create "$TAG" --title "$TAG" --generate-notes --latest \
              cert-manager-webhook-freemyip-*.tgz
          elif [ "$OVERRIDE" = "true" ]; then
            gh release create "$TAG" --title "$TAG" --notes "$NOTES" --latest \
              cert-manager-webhook-freemyip-*.tgz
          else
            # Prepend the supplied text to the generated notes, rather than
            # making the author choose between context and a changelog.
            # v* only. chart-releaser tags cert-manager-webhook-freemyip-<version>
            # minutes earlier in this same run, so an unfiltered list returns
            # that tag as "previous" and the generated notes cover an empty
            # range — every release after the first would ship blank notes.
            prev=$(git tag --sort=-creatordate --list 'v*' | grep -v "^${TAG}$" | head -1)
            generated=""
            if [ -n "$prev" ]; then
              generated=$(gh api "repos/${REPO}/releases/generate-notes" \
                -f tag_name="$TAG" -f previous_tag_name="$prev" --jq '.body' || true)
            fi
            body="$NOTES"
            [ -n "$generated" ] && body="${body}"$'\n\n'"${generated}"
            gh release create "$TAG" --title "$TAG" --notes "$body" --latest \
              cert-manager-webhook-freemyip-*.tgz
          fi

      # The Docker Hub page is deliberately NOT refreshed here.
      #
      # Updating it needs the Docker Hub account password, not a registry token:
      # hub.docker.com/v2 returns 403 for access tokens. That password is the
      # strongest credential this project holds — it can delete repositories and
      # mint new tokens — so it lives in its own environment, dockerhub-metadata,
      # readable only by update_dockerhub_description.yaml. A job can declare
      # exactly one environment, and this one needs `release`, so keeping the
      # refresh here would mean putting the account password alongside the
      # publish credentials. Isolation wins over the convenience.
      # A release that exists but is a draft, or has no chart attached, is a
      # dead install route that every other job would go on to advertise.
      - name: Verify the release is published with its chart
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.resolve.outputs.tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          json=$(gh release view "$TAG" --repo "$REPO" --json isDraft,assets,tagName) \
            || { echo "::error::release ${TAG} does not exist after creating it"; exit 1; }
          [ "$(printf '%s' "$json" | jq -r '.isDraft')" = "false" ] \
            || { echo "::error::release ${TAG} is a draft — nobody can download it"; exit 1; }
          want="cert-manager-webhook-freemyip-${VERSION}.tgz"
          printf '%s' "$json" | jq -e --arg a "$want" '.assets | map(.name) | index($a) != null' >/dev/null \
            || { echo "::error::release ${TAG} does not carry ${want}"; exit 1; }
          echo "release ${TAG} is published and carries ${want}"

      - name: Summarise
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
          GHCR_IMAGE: ${{ needs.resolve.outputs.ghcr_image }}
          HUB_IMAGE: ${{ needs.resolve.outputs.hub_image }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          {
            echo "### Released ${TAG}"
            echo ""
            echo "- \`${GHCR_IMAGE}:${VERSION}\`"
            echo "- \`${HUB_IMAGE}:${VERSION}\`"
            echo "- chart \`${VERSION}\` pushed to the ghcr OCI registry"
          } >> "$GITHUB_STEP_SUMMARY"

  # The Docker Hub page refreshed as part of the release, but through a called
  # workflow whose job declares environment: dockerhub-metadata. Environment
  # scoping is per job, so that job reads the account password and no other job
  # in this run — publish_image and github_release included — can reach it.
  #
  # Only DOCKERHUB_USERNAME is handed over, explicitly rather than by
  # `secrets: inherit`, so the callee receives one value and nothing else.
  # The last write of the release, and the only mutable pointer in it.
  #
  # By the time this runs, all three install routes and the release list already
  # serve this version, so `latest` never points at something nothing else
  # advertises. Every earlier failure leaves `latest` on the previous good
  # release, which is the property that makes a failed release harmless.
  #
  # imagetools create copies the manifest list by digest rather than rebuilding,
  # so `latest` is byte-for-byte the image that was scanned, attested and
  # published — and the attestation still resolves.
  promote_latest:
    name: "Move latest to the released version"
    needs: [resolve, release_approval, publish_image, github_release]
    if: |
      always() && needs.release_approval.result == 'success' &&
      needs.publish_image.result == 'success' &&
      needs.github_release.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      packages: write
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to ghcr.io
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_PAT" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

      - name: Log in to Docker Hub
        env:
          HUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          HUB_PAT: ${{ secrets.DOCKERHUB_RELEASE_TOKEN }}
        run: |
          user=$(printf '%s' "$HUB_USER" | tr -d '[:space:]')
          pat=$(printf '%s' "$HUB_PAT" | tr -d '[:space:]')
          [ "$user" = "$(printf '%s' "$user" | tr '[:upper:]' '[:lower:]')" ] || \
            echo "::warning::DOCKERHUB_USERNAME contains uppercase. Docker Hub currently requires the lowercase Docker ID; if the login below fails with a malformed authorization header, that is why."
          if [ -z "$user" ] || [ -z "$pat" ]; then
            echo "::error::Docker Hub username or token is empty. The username must be the Docker ID, not an email address."
            exit 1
          fi
          printf '%s' "$pat" | docker login docker.io -u "$user" --password-stdin

      # ghcr first: its tags are overwritable, so a failure between the two
      # leaves the recoverable registry moved and the one with immutable version
      # tags untouched. A retry then corrects ghcr and completes Docker Hub.
      - name: Point latest at the released version
        env:
          GHCR_IMAGE: ${{ needs.resolve.outputs.ghcr_image }}
          HUB_IMAGE: ${{ needs.resolve.outputs.hub_image }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          docker buildx imagetools create --tag "${GHCR_IMAGE}:latest" "${GHCR_IMAGE}:${VERSION}"
          docker buildx imagetools create --tag "${HUB_IMAGE}:latest"  "${HUB_IMAGE}:${VERSION}"
          echo "latest now points at ${VERSION} on both registries"

      # Read back, for the same reason the index is read back: this job's
      # success has to mean the pointer actually moved.
      - name: Verify latest resolves to the released digest
        env:
          GHCR_IMAGE: ${{ needs.resolve.outputs.ghcr_image }}
          HUB_IMAGE: ${{ needs.resolve.outputs.hub_image }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          # Both registries. Checking only one would let the other sit on the
          # previous release indefinitely, which is precisely the inconsistency
          # this job exists to close.
          for img in "$GHCR_IMAGE" "$HUB_IMAGE"; do
            v=$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "${img}:${VERSION}")
            l=$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "${img}:latest")
            if [ "$v" != "$l" ]; then
              echo "::error::${img}:latest resolves to ${l}, expected ${v} (${VERSION})"
              exit 1
            fi
            echo "${img}:latest -> ${l}"
          done

  dockerhub_description:
    name: "Refresh the Docker Hub page"
    # After the scan, so the page Docker Hub receives already carries it. It
    # still runs if that job failed — the page is then simply the committed
    # version without a fresh scan, which is better than no page at all, and the
    # reusable workflow falls back on its own.
    needs: [resolve, release_approval, promote_latest, post_release_report]
    if: always() && needs.promote_latest.result == 'success'
    uses: ./.github/workflows/update_dockerhub_description.yaml
    with:
      version: ${{ needs.resolve.outputs.version }}
      page_artifact: scan-pages
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

  # Scan what was actually published, not what was built. The image on the
  # registry is the one people pull, and advisories land after a release as
  # often as before one.
  post_release_report:
    name: "Post-release vulnerability report"
    needs: [resolve, release_approval, promote_latest]
    if: always() && needs.promote_latest.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # Read only. This job runs a third-party scanner over a published image
      # and renders attacker-influenceable strings — package names and CVE text
      # out of somebody else's advisory database — into markdown. It must not
      # also be holding a token that can write to the repository. The commit is
      # done by record_scan, which runs no scanner and touches none of that.
      contents: read
      security-events: write
      issues: write
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Scan the released image
        uses: lhotari/sandboxed-trivy-action@f01374b6cc3bf7264ab238293e94f6db7ada6dd0 # v1.0.2
        with:
          scan-ref: ${{ needs.resolve.outputs.ghcr_image }}:${{ needs.resolve.outputs.version }}
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore
          format: sarif
          output: trivy-released.sarif
          exit-code: 0

      - name: Upload scan results
        if: always()
        uses: github/codeql-action/upload-sarif@cb06a0a8527b2c6970741b3a0baa15231dc74a4c # v4.34.1
        with:
          sarif_file: trivy-released.sarif
          category: trivy-released

      # Every severity, not only the blocking ones. This report is what the
      # README and the Docker Hub page show, and a table that quietly omitted
      # MEDIUM would be a more misleading number than no table at all. The issue
      # step below still filters to CRITICAL and HIGH itself.
      - name: Scan again as JSON, all severities
        uses: lhotari/sandboxed-trivy-action@f01374b6cc3bf7264ab238293e94f6db7ada6dd0 # v1.0.2
        with:
          scan-ref: ${{ needs.resolve.outputs.ghcr_image }}:${{ needs.resolve.outputs.version }}
          severity: CRITICAL,HIGH,MEDIUM,LOW,UNKNOWN
          trivyignores: .trivyignore
          format: json
          output: trivy-released.json
          exit-code: 0

      # Docker Hub scans one repository per account, so the scan its page would
      # otherwise have shown is information this project loses. Rendered from our
      # own scan of the image that was actually published — not of the source
      # tree, and not of the image that was built — and written onto both pages
      # from one source, so the two can never disagree.
      - name: Render the scan onto both pages
        env:
          HUB_IMAGE: ${{ needs.resolve.outputs.hub_image }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          ./scripts/render_scan.sh trivy-released.json \
            "${HUB_IMAGE}:${VERSION}" "$(date -u +%Y-%m-%d)" > scan.md
          ./scripts/apply_scan.sh scan.md README.md docs/dockerhub_description.md
          cat scan.md >> "$GITHUB_STEP_SUMMARY"

      # Handed to the Docker Hub job as an artifact rather than read from the
      # branch: that job checks out the commit this run started from, which
      # cannot contain the commit made below.
      - name: Hand the rendered pages on
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scan-pages
          path: |
            README.md
            docs/dockerhub_description.md
          if-no-files-found: error

      # One issue per CVE, not one issue listing them all: a lumped issue is
      # never closed cleanly and stops being read. Matches how
      # docker-nginx-lego tracks them.
      - name: Open or update an issue per CVE
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          # SC2016: the single-quoted blocks below are jq programs, and $cve is a
          # jq variable bound with --arg. Shell expansion is exactly what must
          # not happen there.
          set -uo pipefail
          today=$(date +%Y-%m-%d)

          cves=$(jq -r '.Results[]?.Vulnerabilities[]? |
            select(.Severity == "CRITICAL" or .Severity == "HIGH") |
            .VulnerabilityID' trivy-released.json 2>/dev/null | sort -u)

          if [ -z "$cves" ]; then
            echo "No CRITICAL or HIGH findings in the released image." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          open_issues=$(gh issue list --repo "$REPO" --label security --state open \
            --json number,title --limit 100 2>/dev/null || echo "[]")

          echo "$cves" | while read -r cve; do
            [ -z "$cve" ] && continue
            row=$(jq -r --arg cve "$cve" '
              .Results[]?.Vulnerabilities[]? |
              select(.VulnerabilityID == $cve) |
              "\(.Severity)\t\(.PkgName)\t\(.FixedVersion // "unknown")"
            ' trivy-released.json | head -1)
            [ -z "$row" ] && continue
            severity=$(printf '%s' "$row" | cut -f1)
            pkg=$(printf '%s' "$row" | cut -f2)
            fixed=$(printf '%s' "$row" | cut -f3)

            labels="security,severity:$(printf '%s' "$severity" | tr '[:upper:]' '[:lower:]')"
            [ "$fixed" = "unknown" ] && labels="${labels},no-fix-available"

            existing=$(printf '%s' "$open_issues" | jq -r --arg cve "$cve" \
              '.[] | select(.title | contains($cve)) | .number' | head -1)

            if [ -n "$existing" ]; then
              gh issue comment "$existing" --repo "$REPO" \
                --body "Still present in release \`${TAG}\` (${today}). Package \`${pkg}\`, fixed in \`${fixed}\`."
            else
              body=$(printf '**CVE:** %s\n**Severity:** %s\n**Package:** `%s`\n**Fixed in:** `%s`\n**Detected in release:** `%s`\n\nTo accept this deliberately, add it to `.trivyignore` with a reason:\n\n```\n%s  # reason accepted\n```\n' \
                "$cve" "$severity" "$pkg" "$fixed" "$TAG" "$cve")
              gh issue create --repo "$REPO" \
                --title "[SECURITY] ${cve}: ${pkg} (${severity})" \
                --body "$body" --label "$labels"
            fi
          done


  # Separated from the job above on purpose. `contents: write` is the permission
  # that can change what this repository says, and it is deliberately not held by
  # anything that runs a scanner, pulls an image, or renders third-party data.
  # This job downloads two files and commits them; that is its whole surface.
  record_scan:
    name: "Record the scan on the default branch"
    needs: [resolve, post_release_report]
    if: always() && needs.post_release_report.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: scan-pages

      # Deliberately not fatal. The release is published and correct by this
      # point, and failing here would mark a good release red over a
      # documentation commit — the warning is the signal, not the exit code.
      - name: Commit the scan onto the default branch
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.repository.default_branch }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -uo pipefail
          for f in README.md docs/dockerhub_description.md; do
            meta=$(gh api "repos/${REPO}/contents/${f}?ref=${BRANCH}" 2>/dev/null || true)
            if [ -z "$meta" ]; then
              echo "::warning::${f} not found on ${BRANCH} — skipped"
              continue
            fi
            sha=$(printf '%s' "$meta" | jq -r '.sha')
            # Identical content would mean an empty commit, which the API
            # rejects — and a release that changed nothing on the page is a
            # normal outcome, not a failure.
            remote=$(printf '%s' "$meta" | jq -r '.content' | base64 -d | sha256sum | cut -d' ' -f1)
            local_sum=$(sha256sum < "$f" | cut -d' ' -f1)
            if [ "$remote" = "$local_sum" ]; then
              echo "${f} already current on ${BRANCH}"
              continue
            fi
            if gh api -X PUT "repos/${REPO}/contents/${f}" \
                 -f message="Record the ${VERSION} vulnerability scan" \
                 -f content="$(base64 < "$f" | tr -d '\n')" \
                 -f sha="$sha" -f branch="$BRANCH" >/dev/null; then
              echo "updated ${f} on ${BRANCH}"
            else
              echo "::warning::could not update ${f} on ${BRANCH}"
            fi
          done


  # Ungated on purpose, and it runs before the deletion job. A reviewer facing
  # an approval prompt after a failed release needs to know that approving
  # deletes tags rather than publishing anything.
  # Only offered when the push actually started. A rejected approval fails the
  # workflow exactly as a broken build does, so gating this on failure() asked
  # for a second approval after every rejection — a question about deleting tags
  # that were never pushed. push_attempted is the only thing that tells the two
  # apart; cancelled() is kept because a job cancelled mid-push never gets to
  # publish its outputs.
  cleanup_notice:
    name: "Pending: approve to delete partially published tags"
    needs: [resolve, publish_image]
    # Both halves are required. push_attempted alone is true on a *successful*
    # release too, which would park a "approve to delete" prompt after every
    # clean release — and approving it would delete the version just published.
    # failure()/cancelled() alone was the original bug: a rejected approval
    # fails the workflow identically to a broken build, so it asked to delete
    # tags that were never pushed.
    #
    # It now keys off publish_image rather than the build, because that is the
    # first job that can put a version tag on Docker Hub. A failure anywhere
    # before it leaves nothing there to delete.
    if: |
      always() && needs.resolve.result == 'success' &&
      needs.publish_image.outputs.push_attempted == 'true' &&
      (failure() || cancelled())
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Explain the pending approval
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          HUB_REPO: ${{ needs.resolve.outputs.hub_repo }}
        run: |
          {
            echo "## Action required: approve Docker Hub tag deletion"
            echo ""
            echo "The push to Docker Hub started and the release did not finish."
            echo "You are seeing this only because tags may actually exist — a"
            echo "rejected release does not reach this point."
            echo ""
            echo "**The next approval DELETEs one tag. It is not a new release attempt.**"
            echo ""
            echo "Tag that will be deleted from \`${HUB_REPO}\` if it exists:"
            echo ""
            echo "- \`${VERSION}\`"
            echo ""
            echo "\`latest\` was never moved. It only moves after the release gate"
            echo "passes, so it still points at the last good release."
            echo ""
            echo "No git tag was created — this workflow creates it last, with the GitHub release — so"
            echo "there is nothing to unwind on the repository side."
            echo ""
            echo "Review deployments → release → Approve and deploy, to proceed with deletion."
          } >> "$GITHUB_STEP_SUMMARY"

  # The approval, separated from the deletion for the same reason the release
  # is: the job that asks carries the reviewer, the job that acts carries the
  # credential. cleanup_notice above stays ungated so its explanation is
  # readable *before* this prompt appears, not after it is answered.
  cleanup_confirm:
    name: "⚠️ Approve to DELETE partially published tags — NOT a release"
    needs: [resolve, cleanup_notice]
    if: always() && needs.cleanup_notice.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release-approval
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Record the decision
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: echo "deletion of ${VERSION} approved"

  cleanup_dockerhub:
    name: "Delete the partially published tags"
    needs: [resolve, cleanup_confirm]
    if: always() && needs.cleanup_confirm.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      # Refuse to delete an image something still points at. This job exists for
      # a failure before the index moved, where the version tag is stranded and
      # unreferenced. If the run got far enough to publish the index, deleting
      # the image here would leave the index advertising a chart whose image is
      # gone — the exact state the publication order exists to prevent. That
      # case needs the full reverse-order unwind, which withdraw_release does.
      - name: Refuse if the chart index still advertises this version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -uo pipefail
          idx=$(gh api "repos/${REPO}/contents/index.yaml?ref=gh-pages" --jq '.content' 2>/dev/null || echo "")
          if [ -n "$idx" ] && printf '%s' "$idx" | base64 -d | grep -q "version: ${VERSION}\$"; then
            echo "::error::the chart repository index still advertises ${VERSION}. Deleting the image now would break every install that reads the index. Run the 'Withdraw a release' workflow instead — it removes the index entry first."
            exit 1
          fi
          echo "nothing advertises ${VERSION} — safe to delete the stranded tag"
      # Docker Hub publishes tag by tag, so a cancel or a failure mid-push can
      # leave a half-released version behind. ghcr is not cleaned up here: its
      # versioned tags are overwritable, so a retry corrects them.
      - name: Delete the tags this run may have pushed
        env:
          HUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          HUB_PAT: ${{ secrets.DOCKERHUB_RELEASE_TOKEN }}
          # hub_repo, not hub_image: the Hub web API addresses repositories as
          # owner/name, with no registry prefix.
          HUB_REPO: ${{ needs.resolve.outputs.hub_repo }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -uo pipefail
          if [ -z "${VERSION:-}" ]; then
            echo "no version resolved — nothing this run could have pushed"
            exit 0
          fi
          # Trimmed for the same reason as the login above: a newline inside the
          # JSON string below makes the body invalid, and the API just refuses.
          # Case is left exactly as stored.
          HUB_USER=$(printf '%s' "$HUB_USER" | tr -d '[:space:]')
          HUB_PAT=$(printf '%s' "$HUB_PAT" | tr -d '[:space:]')
          jwt=$(curl -sf -X POST "https://hub.docker.com/v2/users/login" \
            -H "Content-Type: application/json" \
            -d "{\"username\":\"${HUB_USER}\",\"password\":\"${HUB_PAT}\"}" \
            | grep -o '"token":"[^"]*"' | sed 's/"token":"//; s/"//')
          if [ -z "$jwt" ]; then
            echo "could not authenticate to the Docker Hub API — delete the tags by hand"
            exit 1
          fi
          # The version tag only. `latest` is the mutable production pointer: if
          # this run failed part-way, latest still points at the previous good
          # release, and deleting it would take that release's pointer with it.
          # A retry overwrites latest anyway. docker-nginx-lego excludes it for
          # the same reason.
          code=$(curl -s -o /dev/null -w '%{http_code}' -X DELETE \
            "https://hub.docker.com/v2/repositories/${HUB_REPO}/tags/${VERSION}/" \
            -H "Authorization: Bearer ${jwt}")
          echo "delete ${HUB_REPO}:${VERSION} -> ${code}"
