name: release

on:
  push:
    tags: ["v*"]

# A release must never race another release, and must never be cancelled
# half-published.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: "Publish image and chart"
    runs-on: ubuntu-latest
    # Publishing is gated on the release environment: the job pauses for a
    # required reviewer before any credential is available to it.
    environment: release
    permissions:
      contents: read
      # Scoped to this job only — nothing else in the workflow can write
      # packages.
      packages: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # ghcr.io rejects uppercase in repository names, but github.repository
      # and github.repository_owner preserve the owner's casing.
      - name: Resolve version and targets
        id: meta
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "charts=oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}

      # Every value reaches the shell through env: — an expansion interpolated
      # straight into a run: block is a code-injection sink.
      - name: Push helm chart
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          VERSION: ${{ steps.meta.outputs.version }}
          CHARTS: ${{ steps.meta.outputs.charts }}
        run: |
          printf '%s' "$GHCR_TOKEN" | helm registry login ghcr.io -u "$GHCR_USER" --password-stdin
          helm package charts/cert-manager-webhook-freemyip \
            --version "$VERSION" \
            --app-version "$VERSION"
          helm push "cert-manager-webhook-freemyip-${VERSION}.tgz" "$CHARTS"
