# zizmor suppressions. Every entry needs a reason — an unexplained ignore is
# indistinguishable from an oversight.

rules:
  secrets-outside-env:
    ignore:
      # FREEMYIP_TOKEN and CERTBOT_EMAIL are deliberately repository secrets
      # rather than release-environment secrets. Neither can publish anything:
      # the token only writes a TXT record on one freemyip domain, and the
      # address is only used to register with Let's Encrypt staging. They have
      # to be reachable from pull request jobs, which is exactly what a
      # dedicated environment would prevent.
      #
      # The rule remains active everywhere else, so a publish credential
      # appearing outside environment: release still fails the build — and
      # scripts/validate.sh asserts that separately.
      - integration_tests.yaml

      # Same two secrets, in the release workflow's integration_check job. That
      # job has to run and pass *before* the reviewer is asked to approve —
      # approving a release whose end-to-end test has not run yet would defeat
      # the point of the gate — so it cannot itself sit behind
      # environment: release.
      - release.yaml

      # CVE_AUTOFIX_TOKEN in the scheduled scan's auto-fix job. It is a
      # fine-grained token limited to contents and pull requests, so it can
      # neither publish nor approve a deployment: GitHub's approval endpoint
      # accepts only OAuth app tokens and classic PATs with repo scope. Gating
      # this job on the release environment would make the weekly scan wait for
      # a human every week, which is the opposite of what it is for.
      - scan_vulnerabilities.yaml
